{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block cuerpo %}
<div class="centro">
  <div class="tarjeta">
    <h1>Iniciar sesión</h1>
    <p class="sub">Accede a tus herramientas de documentos.</p>
    <form method="post" autocomplete="off">
      <label>Usuario o correo</label>
      <input type="text" name="usuario" id="usuario" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" required autofocus>
      <label>Contraseña</label>
      <input type="password" name="clave" id="clave" autocomplete="new-password" required>
      <button class="boton" type="submit">Entrar</button>
    </form>
    <p class="nota">¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a></p>
  </div>
</div>
<script>
(function () {
  function limpiar() {
    var u = document.getElementById("usuario");
    var c = document.getElementById("clave");
    if (u) u.value = "";
    if (c) c.value = "";
  }
  window.addEventListener("pageshow", limpiar);
})();
</script>
{% endblock %}
